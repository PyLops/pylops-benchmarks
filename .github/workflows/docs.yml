name: Docs

on:
  workflow_dispatch:
  schedule:
    # every Monday at 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      # solver estimates plotted on the benchmark pages (orphan branch, missing
      # before the first benchmark run)
      - name: Fetch solver estimates
        run: |
          mkdir -p estimates
          if git fetch --depth 1 origin estimates; then
            git archive FETCH_HEAD | tar -x -C estimates
          fi
      - name: Install
        run: uv sync --locked --no-dev --group doc
      - name: Build
        run: uv run sphinx-build -W docs docs/_build/html
      - name: Upload docs as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
